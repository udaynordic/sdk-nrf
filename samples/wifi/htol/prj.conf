CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096

# Wi-Fi LMAC start is triggered from the sample (htol_wifi_subsys_bringup).
# CONFIG_SOC_NRF71_WIFI_BOOT is not set
CONFIG_SOC_SERIES_NRF71_ANTSW_DEFAULT_WIFI=y

# No networking stack, Wi-Fi driver, or WPA supplicant in this sample (yet).
# CONFIG_NETWORKING is not set
# CONFIG_WIFI is not set
# CONFIG_WIFI_NRF71 is not set